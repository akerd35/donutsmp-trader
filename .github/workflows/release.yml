name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # Surum numarasi etiketten gelir; /trader update bunu karsilastirir.
      - name: Sürümü etiketten al
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: chmod +x gradlew
      - run: ./gradlew build -Pmod_version="$MOD_VERSION"

      - name: SHA256 üret
        working-directory: build/libs
        run: sha256sum "donutsmp-trader-$MOD_VERSION.jar" > "donutsmp-trader-$MOD_VERSION.jar.sha256"

      - name: Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/donutsmp-trader-$MOD_VERSION.jar" \
            "build/libs/donutsmp-trader-$MOD_VERSION.jar.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
